name: ci

on:
  push:
    # main, every release branch, and every release tag: a release commit is green in CI before it is published
    branches: [main, "release/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --no-cache-dir ".[dev]"   # not editable: the tests run against the installed package
      - name: Lint
        env:
          RUFF_VERSION: "0.17.3"                # the pin in pyproject.toml's dev extra; keep the two equal
        run: |
          test "$(ruff --version)" = "ruff $RUFF_VERSION"
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest
      - name: Self-test
        run: onloop selftest
      - name: Confidentiality scan (generic patterns)
        run: python tools/confidentiality_scan.py
      - name: Confidentiality scan self-test
        run: python tools/confidentiality_scan.py --self-test

  wheel:
    # The UI is built here, never committed (decision 0009); a wheel without it fails this job instead of shipping.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the UI
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build the wheel
        run: |
          python -m pip install --no-cache-dir build
          python -m build --wheel
      - name: Check the wheel carries the UI
        run: python tools/check_wheel.py dist/*.whl

name: ci

on:
  push:
    # main, every release branch, and every release tag: a release commit is green in CI before it is published
    branches: [main, "release/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --no-cache-dir ".[dev]"   # not editable: the tests run against the installed package
      - name: Lint
        env:
          RUFF_VERSION: "0.17.3"                # the pin in pyproject.toml's dev extra; keep the two equal
        run: |
          test "$(ruff --version)" = "ruff $RUFF_VERSION"
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest
      - name: Self-test
        run: onloop selftest
      - name: Confidentiality scan (generic patterns)
        run: python tools/confidentiality_scan.py
      - name: Confidentiality scan self-test
        run: python tools/confidentiality_scan.py --self-test

  wheel:
    # The UI is built here, never committed (decision 0009); a wheel without it fails this job instead of shipping.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the UI
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
      - name: Build the sdist and the wheel, as a release does
        run: |
          python -m pip install --no-cache-dir build
          python -m build    # the sdist first, then the wheel from it: the release workflow's own build
      - name: Check the wheel carries the UI
        run: python tools/check_wheel.py dist/*.whl
      - name: Check the sdist carries the UI
        run: tar tzf dist/*.tar.gz | grep -q '/src/onloop/ui/index.html$'
      # The vulnerability audit (0.6.0): what the wheel installs, and the UI's production dependencies. An advisory on
      # .github/audit-allowlist.yml (each with a reason and an expiry) passes; an expired entry fails.
      - name: Check the audit allowlist
        run: |
          python -m pip install --no-cache-dir "PyYAML>=6"
          python tools/audit_gate.py check
      - name: Vulnerability audit (npm, production dependencies; high or critical fails)
        working-directory: web
        run: |
          npm audit --json --omit=dev > ../npm-audit.json || true   # npm exits 1 on any finding; the gate decides
          python ../tools/audit_gate.py npm < ../npm-audit.json
      - name: Vulnerability audit (pip, the installed package)
        run: |
          python -m venv /tmp/onloop-env
          /tmp/onloop-env/bin/python -m pip install --no-cache-dir --upgrade pip
          /tmp/onloop-env/bin/python -m pip install --no-cache-dir dist/*.whl
          python -m venv /tmp/audit-env
          /tmp/audit-env/bin/python -m pip install --no-cache-dir "pip-audit==2.7.3"
          site=$(/tmp/onloop-env/bin/python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
          # every advisory fails unless allowlisted: pip-audit reports no severity
          /tmp/audit-env/bin/pip-audit --path "$site" --desc $(python tools/audit_gate.py pip-ignores)

  e2e:
    # The browser tests (web/e2e) against onloopd's real server over the demo ledger (generic sample data), on one
    # browser Playwright installs here. The report is kept when a test fails.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the UI
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Install onloop with the built UI
        run: python -m pip install --no-cache-dir .   # after the build: the installed package serves that UI
      - name: Install the browser
        working-directory: web
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Browser tests
        working-directory: web
        env:
          ONLOOP_PYTHON: python
          PW_CHANNEL: ""                  # Playwright's own Chromium, not an installed Chrome
        run: npm run e2e
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14

name: release

# On a release tag: build the wheel and the sdist from the tag, write SHA256SUMS, attest where each file was built
# (GitHub artifact attestations, Sigstore-signed), and attach all of it to a draft release. A person reads CI's result
# on the tag's commit and publishes the draft (docs/release.md). Nothing is published from here.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the draft release and upload its files
      id-token: write       # the attestation's signing identity
      attestations: write   # store the attestations
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: The tag names the package's version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c 'import re, pathlib; m = re.search(r"__version__ = \"([^\"]+)\"", pathlib.Path("src/onloop/__init__.py").read_text()); print(m.group(1) if m else "")')
          if [ -z "$version" ]; then echo "no __version__ = \"X.Y.Z\" in src/onloop/__init__.py"; exit 1; fi
          echo "tag $tag, onloop.__version__ $version"
          test "$tag" = "$version" || { echo "the tag names $tag, the package is $version"; exit 1; }
      - name: Build the UI
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
      - name: Build the wheel and the sdist
        run: |
          python -m pip install --no-cache-dir build
          python -m build
      - name: Check the wheel carries the UI
        run: python tools/check_wheel.py dist/*.whl
      - name: Check the sdist carries the UI
        run: tar tzf dist/*.tar.gz | grep -q '/src/onloop/ui/index.html$'
      - name: Self-test the wheel to be released
        run: |
          python -m venv /tmp/released
          /tmp/released/bin/python -m pip install --no-cache-dir dist/*.whl
          /tmp/released/bin/onloop selftest
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum *.whl *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Attest where the files were built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
            --draft --verify-tag --title "onloop ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md

# Weekly update proposals for the pinned Actions and the dependencies (0.6.0's hardening). Each ecosystem's updates
# come grouped into one pull request; a person reviews and merges it. The Actions are pinned by full commit SHA with
# the version in a comment, and Dependabot updates both.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]

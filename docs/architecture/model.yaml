  # ================================================================================================ dynamic (a)
  - key: dynamic-wake
    name: Dynamic wake and ack
    level: Dynamic · target flow (R4)
    title: "[Dynamic] A wake, acknowledged only by a valid outcome"
    subtitle: >-
      How one delivery to a role is tracked from created to acknowledged. Steps 7–10 run on main today; the conductor
      and sessions that drive steps 1–6 and 11 are R4.
    size: [2240, 1180]
    wrap: 30
    elements:
      conductor: {x: 80, y: 190, w: 280, h: 170}
      sessions: {x: 600, y: 190, w: 300, h: 190}
      claude_proc: {x: 1180, y: 190, w: 320, h: 200}
      anthropic: {x: 1820, y: 200, w: 300, h: 170}
      ledger: {x: 80, y: 660, w: 280, h: 190}
      hook_receiver: {x: 600, y: 650, w: 300, h: 160}
      disposition: {x: 600, y: 900, w: 300, h: 150}
      hooks: {x: 1180, y: 650, w: 320, h: 170}
    steps:
      - {from: conductor, to: ledger, description: "Delivery created; lease taken for the session id", technology: ledger append, status: planned, layout: {exit: [0.3, 1], entry: [0.3, 0]}}
      - {from: conductor, to: sessions, description: "Wake role R with delivery D", technology: Python call, status: planned, layout: {exit: [1, 0.5], entry: [0, 0.45], wrap: 20}}
      - {from: sessions, to: claude_proc, description: "Start claude -p --resume <id>; write the message: delivered", technology: "subprocess, stream-json stdin", status: planned, layout: {exit: [1, 0.15], entry: [0, 0.15]}}
      - {from: claude_proc, to: sessions, description: "Replays the message when its turn starts: processing", technology: "--replay-user-messages", status: planned, layout: {exit: [0, 0.5], entry: [1, 0.5]}}
      - {from: claude_proc, to: anthropic, description: Inference for the turn, technology: "HTTPS, subscription", status: built, layout: {exit: [1, 0.5], entry: [0, 0.5]}}
      - {from: claude_proc, to: sessions, description: "Result line: is_error false, permission_denials empty", technology: stream-json result, status: planned, layout: {exit: [0, 0.85], entry: [1, 0.85]}}
      - {from: claude_proc, to: hooks, description: "Stop hook with last_assistant_message", technology: hook JSON on stdin, status: built, layout: {exit: [0.5, 1], entry: [0.5, 0]}}
      - {from: hooks, to: hook_receiver, description: "POST /hooks/stop", technology: "HTTP :${onloopd_port}, Bearer, ≤ 2 s", status: built, layout: {exit: [0, 0.5], entry: [1, 0.5]}}
      - {from: hook_receiver, to: disposition, description: "Parses the outcome line: valid", technology: Python call, status: built, layout: {exit: [0.5, 1], entry: [0.5, 0]}}
      - {from: hook_receiver, to: ledger, description: "Turn recorded; delivery acknowledged", technology: ledger append, status: built, layout: {exit: [0, 0.5], entry: [1, 0.48], wrap: 22}}
      - {from: sessions, to: ledger, description: Lease released, technology: ledger append, status: planned, layout: {exit: [0.15, 1], entry: [0.8, 0], points: [[645, 530], [304, 530]]}}
    notes:
      - x: 1560
        y: 470
        w: 600
        h: 250
        size: 12
        text: >-
          <b>Steps</b><br>
          <b>1</b> The conductor creates delivery D (state <i>created</i>) and takes the lease on R's session id. Two
          processes on one id fork the session silently, so the lease is mandatory.<br>
          <b>2–3</b> Sessions starts the CLI with a scrubbed environment and writes D to stdin: <i>delivered</i>.<br>
          <b>4</b> The CLI replays a message only when its turn starts: <i>processing</i>. The replay acknowledges
          processing, not receipt; receipt is onloop's own queue.<br>
          <b>6</b> Every result line is checked. <i>is_error</i> true, or any <i>permission_denials</i>, fails the
          delivery although the exit code is 0.<br>
          <b>7–10</b> The Stop hook carries the final message. Only a valid outcome line acknowledges D; a missing or
          invalid one opens a missing-outcome alert instead.<br>
          <b>11</b> The lease is released, so the next wake may resume the session.
    legend: {x: 1560, y: 840, w: 420}

  # ================================================================================================ dynamic (b)
  - key: dynamic-dead-waker
    name: Dynamic dead waker
    level: Dynamic · built
    title: "[Dynamic] A dead waker behind a continue becomes the constraint"
    subtitle: >-
      A role ends its turn with outcome: continue and names what will wake it. The waker dies. On the next tick
      onloopd finds it, alerts once, and the constraint query names it. Built on main.
    size: [2260, 1320]
    wrap: 22
    elements:
      claude_proc: {x: 60, y: 190, w: 300, h: 200, description: "Role R's turn ends: … outcome: continue ref=item-42 waker=pid:4242"}
      waker: {x: 540, y: 200, w: 300, h: 180, description: "pid 4242, a background build. It exits; nothing will wake R."}
      wakers: {x: 1020, y: 200, w: 300, h: 180}
      main: {x: 1500, y: 190, w: 300, h: 190}
      hooks: {x: 60, y: 560, w: 300, h: 180}
      hook_receiver: {x: 540, y: 560, w: 300, h: 180}
      ledger: {x: 1020, y: 550, w: 300, h: 200}
      detect_core: {x: 1500, y: 560, w: 300, h: 190}
      server: {x: 1960, y: 560, w: 240, h: 190, description: "GET /api/constraint"}
      disposition: {x: 540, y: 900, w: 300, h: 160}
      constraint: {x: 1500, y: 900, w: 300, h: 160}
      lead: {x: 1960, y: 880, w: 240, h: 260}
    steps:
      - {from: claude_proc, to: hooks, description: Stop hook with the final message, technology: hook JSON on stdin, status: built, layout: {exit: [0.5, 1], entry: [0.5, 0], wrap: 34}}
      - {from: hooks, to: hook_receiver, description: "POST /hooks/stop", technology: "HTTP, Bearer", status: built, layout: {exit: [1, 0.5], entry: [0, 0.5]}}
      - {from: hook_receiver, to: disposition, description: "continue, ref=item-42, waker=pid:4242", technology: Python call, status: built, layout: {exit: [0.5, 1], entry: [0.5, 0], wrap: 40}}
      - {from: hook_receiver, to: ledger, description: "Turn row; item-42 waits on waker pid:4242", technology: ledger append, status: built, layout: {exit: [1, 0.5], entry: [0, 0.5]}}
      - {from: main, to: wakers, description: "Next tick (≤ 10 s): probe each waker with an open wait", technology: Python call, status: built, layout: {exit: [0, 0.5], entry: [1, 0.5]}}
      - {from: wakers, to: waker, description: "pid_alive(4242): false", technology: procs.pid_alive, status: built, layout: {exit: [0, 0.5], entry: [1, 0.5]}}
      - {from: wakers, to: ledger, description: "resource.checked: dead (on a change only)", technology: ledger append, status: built, layout: {exit: [0.5, 1], entry: [0.5, 0], wrap: 40}}
      - {from: main, to: detect_core, description: "Runs the detectors", technology: Python call, status: built, layout: {exit: [0.5, 1], entry: [0.5, 0], wrap: 40}}
      - {from: detect_core, to: ledger, description: "One alert naming every stranded item and role; would.wake logged", technology: ledger append, status: built, layout: {exit: [0, 0.5], entry: [1, 0.5]}}
      - {from: lead, to: server, description: Asks what holds the work up, technology: "GET /api/constraint", status: built, layout: {exit: [0.5, 0], entry: [0.5, 1], wrap: 34}}
      - {from: server, to: constraint, description: "Computes over open waits: pid:4242, reason dead_waker", technology: Python call, status: built, layout: {exit: [0, 0.85], entry: [1, 0.3], points: [[1880, 721], [1880, 948]], label_pos: 0.1}}
    notes:
      - x: 60
        y: 900
        w: 420
        h: 120
        size: 11
        text: >-
          <b>Why this matters</b><br>
          A continue with a dead waker waits for ever while every role looks idle. The probe logs a state change, not
          every tick; the alert is one item per waker, updated as more items strand, and closed on the first tick the
          condition is gone. Today the would.wake is only recorded; R4 acts on it.
    legend: {x: 960, y: 880, w: 420}
